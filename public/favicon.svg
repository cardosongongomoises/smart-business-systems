<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C1E"/>
      <stop offset="50%" stop-color="#0E132B"/>
      <stop offset="100%" stop-color="#140D2B"/>
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Left Leg Ribbon Gradient -->
    <linearGradient id="leftLeg" x1="120" y1="360" x2="270" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0EA5E9"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Right Leg Gradient -->
    <linearGradient id="rightLeg" x1="250" y1="160" x2="390" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Orbital Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="130" y1="310" x2="390" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Neon Border -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Subtle Radial Inner Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#3B82F6" opacity="0.15" filter="url(#starGlow)"/>

  <!-- Left Leg of A (Curved Ribbon) -->
  <path d="M 136 354 C 158 350 216 276 256 150 C 264 126 274 130 282 152 C 260 256 206 332 156 354 Z" fill="url(#leftLeg)"/>

  <!-- Right Leg of A -->
  <path d="M 264 148 C 274 132 284 138 292 160 L 388 356 C 392 364 384 366 364 366 C 342 366 334 360 330 350 L 268 220 L 264 148 Z" fill="url(#rightLeg)"/>

  <!-- Orbital Swoosh looping around the A -->
  <path d="M 142 334 C 186 314 286 264 368 214 C 386 202 388 218 368 238 C 298 298 202 344 142 334 Z" fill="url(#swooshGrad)"/>

  <!-- 4-pointed Sparkle Star -->
  <g transform="translate(352, 172)" filter="url(#starGlow)">
    <path d="M 0 -24 Q 3 -6 24 0 Q 3 6 0 24 Q -3 6 -24 0 Q -3 -6 0 -24 Z" fill="#E0E7FF"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
